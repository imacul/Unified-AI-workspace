<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Unified Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{
  --bg-1:#0b0f14;
  --bg-2:#0f1720;
  --panel:#141b25;
  --panel-2:#10161f;
  --panel-3:#0c121a;
  --border:#1e2a3a;
  --text:#e8eef6;
  --muted:#9aa8ba;
  --accent:#14b8a6;
  --accent-2:#f59e0b;
  --danger:#f87171;
  --shadow:0 20px 60px rgba(0,0,0,.35);
}
/* Accessibility helpers */
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* Focus styles for keyboard users */
:focus-visible{outline:3px solid rgba(20,184,166,0.25);outline-offset:3px;border-radius:6px}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:"Space Grotesk",system-ui,sans-serif;
  color:var(--text);
  background:
    radial-gradient(1200px 600px at 10% -10%, #113249 0%, transparent 55%),
    radial-gradient(900px 500px at 90% 0%, #1b2b3d 0%, transparent 55%),
    linear-gradient(180deg, var(--bg-1), var(--bg-2));
  height:100vh;
  display:flex;
  overflow:hidden;
}
/* Hide scrollbars but keep scroll */
*{
  scrollbar-width:none;
}
*::-webkit-scrollbar{
  width:0;
  height:0;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:radial-gradient(#ffffff10 1px, transparent 1px);
  background-size:24px 24px;
  opacity:.15;
  pointer-events:none;
}

aside{
  width:280px;
  background:linear-gradient(180deg, #0c121a, #0b1017);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:20px 16px;
  gap:16px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:700;
  letter-spacing:.2px;
  font-size:1.1rem;
}
.brand-dot{
  width:12px;height:12px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 0 18px rgba(20,184,166,.6);
}
.btn-new{
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--text);
  padding:10px 12px;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
  transition:transform .15s ease, background .2s ease;
}
.btn-new:hover{background:#172231;transform:translateY(-1px);}
.history-list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;}
.history-item{
  padding:10px 12px;
  border-radius:10px;
  color:var(--muted);
  cursor:pointer;
  background:transparent;
  border:1px solid transparent;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.history-item:hover{background:#121a26;border-color:#1f2b3c;color:var(--text);}
.history-item.active{background:#152131;border-color:#243347;color:var(--text);}
.sidebar-footer{
  border-top:1px solid var(--border);
  padding-top:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:var(--muted);
  font-size:.85rem;
}
.profile-pic{
  width:32px;height:32px;border-radius:10px;
  background:linear-gradient(135deg,#2f3b52,#1d2736);
}
.profile-pic[role="img"]{display:inline-block}

main{
  flex:1;
  display:flex;
  flex-direction:column;
  position:relative;
}
.topbar{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  border-bottom:1px solid var(--border);
  background:rgba(12,18,26,.6);
  backdrop-filter:blur(8px);
}
.selectors{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
select{
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--text);
  padding:8px 12px;
  border-radius:10px;
  font-size:.85rem;
  outline:none;
  cursor:pointer;
}
.toggles{display:flex;gap:16px;align-items:center;color:var(--muted);font-size:.85rem;}
.toggle{
  display:flex;align-items:center;gap:8px;
  background:var(--panel);
  border:1px solid var(--border);
  padding:6px 10px;border-radius:999px;
}
.toggle input{accent-color:var(--accent);}
.btn-ghost{
  background:transparent;border:1px solid var(--border);color:var(--muted);
  padding:8px 12px;border-radius:10px;cursor:pointer;
}
.btn-ghost:hover{color:var(--text);border-color:#2a3b52;}

#chat-container{
  flex:1;
  overflow:auto;
  padding:28px 10%;
  display:flex;
  flex-direction:column;
  gap:18px;
}
.message{
  max-width:900px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px 18px;
  box-shadow:var(--shadow);
}
.message.user{
  align-self:flex-end;
  background:linear-gradient(135deg,#1a2736,#121b27);
  border-color:#2a3b52;
}
.message.ai{align-self:flex-start;background:var(--panel-2);}
.message-header{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;
}
.model-tag{
  font-size:.72rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;
}
.msg-actions{display:flex;gap:8px;}
.msg-action{
  background:var(--panel-3);
  border:1px solid var(--border);
  color:var(--muted);
  padding:4px 8px;border-radius:8px;font-size:.72rem;cursor:pointer;
}
.msg-action:hover{color:var(--text);border-color:#2a3b52;}

.message-content{color:var(--text);font-size:1rem;line-height:1.7;}
.message-content p{margin:0 0 12px 0;}
.message-content h1,.message-content h2,.message-content h3{margin:16px 0 10px;line-height:1.2;}
.message-content ul,.message-content ol{margin:0 0 12px 20px;}
.message-content code{
  background:#0f141c;border:1px solid #202a3a;
  padding:2px 6px;border-radius:6px;
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:.95em;
}
.message-content pre{
  position:relative;
  background:#0f141c;
  border:1px solid #202a3a;
  padding:14px 16px;border-radius:12px;overflow:auto;
}
.message-content pre code{
  display:block;background:transparent;padding:0;white-space:pre;
  font-family:"JetBrains Mono",ui-monospace,monospace;
}
.code-copy{
  position:absolute;top:10px;right:10px;
  background:#1b2636;border:1px solid #2a3b52;color:#e8eef6;
  border-radius:8px;padding:4px 8px;font-size:.75rem;cursor:pointer;
}
.code-copy:hover{background:#223149;}

.input-wrap{
  padding:18px 10% 28px;
  background:linear-gradient(180deg, transparent, rgba(11,15,20,.9) 30%);
}
.input-box{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px 14px;
  display:flex;
  align-items:flex-end;
  gap:12px;
  box-shadow:var(--shadow);
}
textarea{
  flex:1;
  background:transparent;border:none;color:var(--text);
  resize:none;font-family:inherit;font-size:1rem;outline:none;max-height:220px;
}
.btn-send{
  background:linear-gradient(135deg,var(--accent),#0ea5a5);
  color:#041016;border:none;width:38px;height:38px;border-radius:10px;
  cursor:pointer;font-weight:700;
}
.btn-send:disabled{opacity:.6;cursor:not-allowed;}
.typing-indicator{color:var(--muted);font-size:.85rem;}

@media (max-width: 980px){
  aside{display:none;}
  #chat-container{padding:24px 6%;}
  .input-wrap{padding:16px 6% 22px;}
}
</style>
</head>
<body>
  <a href="#chat-container" class="sr-only">Skip to chat</a>

<aside>
  <div class="brand"><span class="brand-dot"></span>Unified AI</div>
  <button class="btn-new" onclick="newChat()">+ New Chat</button>
  <div class="history-list chat-list"></div>
  <div class="sidebar-footer">
    <span>Workspace</span>
    <div class="profile-pic"></div>
  </div>
</aside>

<main>
  <div class="topbar">
      <div style="display:flex;align-items:center;gap:8px;">
      <label for="provider-select" class="sr-only">Provider</label>
      <select id="provider-select" aria-label="Provider selection">
        <option value="gpt">ChatGPT</option>
        <option value="claude">Claude</option>
        <option value="gemini">Gemini</option>
        <option value="huggingface" selected>Hugging Face</option>
      </select>
      <label for="model-select" class="sr-only">Model</label>
      <select id="model-select" aria-label="Model selection"></select>
    </div>
    <div class="toggles">
      <button class="btn-ghost" onclick="clearChat()">Clear</button>
      <div style="display:flex;align-items:center;gap:8px;">
        <button id="auth-btn" class="btn-ghost" onclick="openAuthModal()" aria-haspopup="dialog">Auth</button>
        <label for="search-input" class="sr-only">Search conversations</label>
        <input id="search-input" aria-label="Search conversations" placeholder="Search conversations" style="background:var(--panel);border:1px solid var(--border);color:var(--muted);padding:8px 10px;border-radius:8px;width:220px;" />
        <button class="btn-ghost" onclick="performSearch()">Search</button>
        <div style="position:relative;">
          <button class="btn-ghost" id="export-btn" aria-haspopup="true" aria-expanded="false">Export ▾</button>
          <div id="export-menu" style="display:none;position:absolute;right:0;top:40px;background:var(--panel);border:1px solid var(--border);padding:6px;border-radius:8px;width:140px;">
            <div style="display:flex;flex-direction:column;gap:6px;">
              <button class="btn-ghost" onclick="exportCurrentSession('json')">Export JSON</button>
              <button class="btn-ghost" onclick="exportCurrentSession('md')">Export Markdown</button>
              <button class="btn-ghost" onclick="exportCurrentSession('pdf')">Export PDF</button>
            </div>
          </div>
        </div>
        <button id="analytics-btn" class="btn-ghost" onclick="openAnalytics()">Analytics</button>
      </div>
      <label class="toggle">Memory <input type="checkbox" checked></label>
      <label class="toggle">Stream <input id="stream-toggle" type="checkbox" checked></label>
    </div>
  </div>

  <div id="chat-container" class="chat-messages" role="log" aria-live="polite" aria-atomic="false"></div>

    <!-- Search results panel -->
    <div id="search-results" style="position:fixed;right:20px;top:90px;width:360px;max-height:60vh;overflow:auto;display:none;background:linear-gradient(180deg,#081018,#0b1118);border:1px solid var(--border);padding:12px;border-radius:10px;z-index:40;box-shadow:var(--shadow);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <strong>Search Results</strong>
        <button class="btn-ghost" onclick="closeSearchResults()">Close</button>
      </div>
      <div id="search-results-list"></div>
    </div>

  <div class="input-wrap">
    <div class="input-box">
      <span class="typing-indicator" id="typing-indicator" style="display:none;">AI typing…</span>
      <textarea id="user-input" placeholder="Ask anything..." rows="1"></textarea>
      <button id="send-btn" class="btn-send" onclick="sendMessage()">↑</button>
    </div>
  </div>
</main>

<script>
const models = {
  gpt: ['GPT-4o','GPT-4 Turbo','GPT-3.5'],
  claude: ['Claude 3.5 Sonnet','Claude 3 Opus','Claude 3 Haiku'],
  gemini: ['Gemini 1.5 Pro','Gemini 1.5 Flash'],
  huggingface: ['meta-llama/Llama-3.1-8B-Instruct']
};

let appState = { conversations:[], activeConversationId:null };

function saveState(){ localStorage.setItem("ai_workspace_state", JSON.stringify(appState)); }
function loadState(){ const saved = localStorage.getItem("ai_workspace_state"); if(saved) appState = JSON.parse(saved); }

function createConversation(provider, model){ return { id:crypto.randomUUID(), title:"New Chat", provider, model, messages:[], createdAt:Date.now() }; }
function createMessage(role, content, provider=null, model=null){ return { role, content, provider, model, timestamp:Date.now() }; }

function renderConversationList(){
  const list = document.querySelector(".chat-list");
  list.innerHTML = "";
  appState.conversations.forEach(conv=>{
    const div=document.createElement("div");
    div.className="history-item"+(conv.id===appState.activeConversationId?" active":"");
    div.textContent=conv.title;
    div.onclick=()=>{ appState.activeConversationId=conv.id; saveState(); render(); };
    list.appendChild(div);
  });
}

function renderMessages(){
  const chat=document.querySelector(".chat-messages");
  chat.innerHTML="";
  const conv=appState.conversations.find(c=>c.id===appState.activeConversationId);
  if(!conv) return;
  conv.messages.forEach(msg=>{
    const div=document.createElement("div");
    div.className="message "+(msg.role==="assistant"?"ai":"user");
    // Accessibility: make each message an article with an accessible label
    div.setAttribute('role','article');
    div.setAttribute('aria-label', `${msg.role} message at ${new Date(msg.timestamp).toLocaleString()}`);
    if (msg.role === "assistant") {
      div.innerHTML = `
        <div class="message-header">
          <span class="model-tag">${msg.model || ""}</span>
          <div class="msg-actions">
            <button class="msg-action" data-copy="true">Copy</button>
          </div>
        </div>
        <div class="message-content">${renderMarkdown(msg.content || "")}</div>
      `;
      div.querySelector('[data-copy="true"]').onclick = () => {
        navigator.clipboard.writeText(msg.content || "");
      };
      enhanceCodeBlocks(div);
    } else {
      div.textContent = msg.content || "";
    }
    chat.appendChild(div);
  });
  chat.scrollTop=chat.scrollHeight;
}

function render(){ renderConversationList(); renderMessages(); updateModels(); }

function updateModels(){
  const provider=document.getElementById('provider-select').value;
  const modelSelect=document.getElementById('model-select');
  modelSelect.innerHTML="";
  models[provider].forEach(m=>{
    const opt=document.createElement('option');
    opt.value=m; opt.textContent=m;
    modelSelect.appendChild(opt);
  });
}

async function sendMessage(){
  const input=document.getElementById('user-input');
  const text=input.value.trim();
  if(!text) return;
  const provider=document.getElementById('provider-select').value;
  const model=document.getElementById('model-select').value;
  let conv=appState.conversations.find(c=>c.id===appState.activeConversationId);
  if(!conv){
    conv=createConversation(provider,model);
    appState.conversations.push(conv);
    appState.activeConversationId=conv.id;
  } else {
    conv.provider = provider;
    conv.model = model;
  }

  conv.messages.push(createMessage("user", text, conv.provider, conv.model));
  conv.title=text.slice(0,30);
  render();
  saveState();
  input.value="";

  const sendBtn = document.getElementById('send-btn');
  const typingEl = document.getElementById('typing-indicator');
  const setLoading = (loading) => {
    typingEl.style.display = loading ? 'inline-block' : 'none';
    sendBtn.disabled = loading;
    input.disabled = loading;
    sendBtn.style.opacity = loading ? '0.6' : '';
  };

  setLoading(true);
  try {
    const streamEnabled = document.getElementById("stream-toggle").checked;
    const payload = { conversationId: conv.id, text, provider: conv.provider, model: conv.model, stream: streamEnabled && conv.provider === "huggingface" };

    const response = await fetch("http://localhost:3000/sendmessage", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const contentType = response.headers.get("content-type") || "";
    if (contentType.includes("text/event-stream") && response.body) {
      const assistantMsg = createMessage("assistant", "", conv.provider, conv.model);
      conv.messages.push(assistantMsg);
      renderMessages();

      const reader = response.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";
      let done = false;
      try {
        while (!done) {
          const { value, done: readDone } = await reader.read();
          done = readDone;
          if (value) {
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split("\n");
            buffer = lines.pop() || "";
            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed.startsWith("data:")) continue;
              const data = trimmed.slice(5).trim();
              if (data === "[DONE]") { done = true; break; }
              try {
                const parsed = JSON.parse(data);
                if (parsed?.error) { assistantMsg.content += `\n\n**Error:** ${parsed.error}`; continue; }
                const delta = parsed?.delta || parsed?.choices?.[0]?.delta?.content || parsed?.choices?.[0]?.message?.content || "";
                if (delta) assistantMsg.content += delta;
              } catch (e) {
                assistantMsg.content += data;
              }
            }
            renderMessages();
          }
        }
      } catch (streamErr) {
        console.error('Stream error, attempting one retry:', streamErr);
        // Exponential backoff retry with jitter
        const maxRetries = 3;
        let attempt = 0;
        let succeeded = false;
        while(attempt < maxRetries && !succeeded){
          attempt++;
          const delay = Math.pow(2, attempt) * 250; // 500ms, 1s, 2s
          const jitter = Math.floor(Math.random() * 250);
          await new Promise(r => setTimeout(r, delay + jitter));
          try {
            const retryResp = await fetch("http://localhost:3000/sendmessage", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });
            if(retryResp.ok){
              const ct = retryResp.headers.get('content-type') || '';
              if(ct.includes('text/event-stream')){
                // If the server returned a new stream, fall back to fetching a non-stream JSON summary
                const retryData = await retryResp.json().catch(()=>null);
                if (retryData && retryData.message) assistantMsg.content += retryData.message;
              } else {
                const retryData = await retryResp.json();
                if (retryData && retryData.message) assistantMsg.content += retryData.message;
              }
              succeeded = true;
              break;
            }
          } catch (retryErr) {
            // continue loop
          }
        }
        if(!succeeded){ assistantMsg.content += `\n\n[Stream failed after ${maxRetries} retries]`; }
        renderMessages();
      }
    } else {
      const data = await response.json();
      if (data && data.message) {
        const respProvider = data.provider || conv.provider;
        const respModel = data.model || conv.model;
        conv.messages.push(createMessage("assistant", data.message, respProvider, respModel));
      } else if (data && data.error) {
        conv.messages.push(createMessage("assistant", `AI error: ${data.error}`));
      } else {
        conv.messages.push(createMessage("assistant", "No response from backend."));
      }
    }

    render();
    saveState();
  } catch(err){
    console.error("Backend request failed:", err);
    conv.messages.push(createMessage("assistant", `AI response failed: ${err.message || err}`));
    render();
    saveState();
  } finally {
    setLoading(false);
  }
}

function newChat(){ appState.activeConversationId=null; render(); }
function clearChat(){
  const conv=appState.conversations.find(c=>c.id===appState.activeConversationId);
  if(!conv) return;
  conv.messages=[];
  saveState();
  render();
}

function renderMarkdown(text){
  if (window.marked) {
    return marked.parse(text || "", { breaks: true });
  }
  return (text || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function enhanceCodeBlocks(container){
  container.querySelectorAll('pre code').forEach(code => {
    if (window.hljs) hljs.highlightElement(code);
  });
  container.querySelectorAll('pre').forEach(pre => {
    if (pre.dataset.enhanced) return;
    pre.dataset.enhanced = "1";
    const btn = document.createElement("button");
    btn.className = "code-copy";
    btn.textContent = "Copy";
    btn.onclick = async () => {
      const code = pre.querySelector("code");
      if (!code) return;
      await navigator.clipboard.writeText(code.innerText);
      btn.textContent = "Copied";
      setTimeout(() => btn.textContent = "Copy", 1200);
    };
    pre.appendChild(btn);
  });
}

loadState();
render();

document.querySelector('#user-input').addEventListener('keypress', function(e){
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});

// --- Export & Search helpers ---
function getAuthHeaders(){
  const headers = { 'Content-Type': 'application/json' };
  try{
    const token = localStorage.getItem('auth_token');
    if(token) headers['Authorization'] = `Bearer ${token}`;
  }catch(e){}
  return headers;
}

function toggleExportMenu(){
  const menu = document.getElementById('export-menu');
  const btn = document.getElementById('export-btn');
  if(!menu) return;
  const open = menu.style.display !== 'block';
  menu.style.display = open ? 'block' : 'none';
  if(btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
}
const exportBtnEl = document.getElementById('export-btn');
if(exportBtnEl) exportBtnEl.addEventListener('click', (e)=>{ e.stopPropagation(); toggleExportMenu(); });
document.addEventListener('click', ()=>{ const m=document.getElementById('export-menu'); if(m) { m.style.display='none'; const btn=document.getElementById('export-btn'); if(btn) btn.setAttribute('aria-expanded','false'); } });

async function exportCurrentSession(format){
  const conv = appState.conversations.find(c=>c.id===appState.activeConversationId);
  if(!conv){ alert('No active conversation to export'); return; }
  const sid = conv.id;
  const url = `/export?sessionId=${encodeURIComponent(sid)}&format=${encodeURIComponent(format)}`;
  try{
    const res = await fetch(url, { method: 'GET', headers: getAuthHeaders() });
    if(!res.ok){ const err = await res.json().catch(()=>({ error: 'Export failed' })); return alert('Export failed: '+(err.error||res.status)); }
    const ct = res.headers.get('content-type')||'';
    const blob = await res.blob();
    const ext = format === 'md' ? 'md' : format === 'pdf' ? 'pdf' : 'json';
    const filename = `${sid}.${ext}`;
    const urlObj = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = urlObj; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(urlObj);
  }catch(err){ console.error('Export failed', err); alert('Export failed: '+(err && err.message)); }
}

async function performSearch(){
  const q = document.getElementById('search-input').value.trim();
  if(!q) return alert('Enter search query');
  try{
    const res = await fetch(`/search?q=${encodeURIComponent(q)}`, { method: 'GET', headers: getAuthHeaders() });
    if(!res.ok){ const err = await res.json().catch(()=>({ error: 'Search failed' })); return alert('Search error: '+(err.error||res.status)); }
    const data = await res.json();
    renderSearchResults(data.results || []);
  }catch(err){ console.error('Search failed', err); alert('Search failed: '+(err && err.message)); }
}

function renderSearchResults(results){
  const panel = document.getElementById('search-results');
  const list = document.getElementById('search-results-list');
  list.innerHTML = '';
  if(!results || results.length===0){ list.innerHTML = '<div style="color:var(--muted)">No results</div>'; }
  results.forEach(r=>{
    const el = document.createElement('div');
    el.style.padding='8px'; el.style.borderBottom='1px solid var(--border)'; el.style.cursor='pointer';
    el.innerHTML = `<div style="font-weight:700;color:var(--text)">${r.sessionId}</div><div style="color:var(--muted);font-size:.9rem;margin-top:6px">${r.snippet||''}</div>`;
    el.onclick = ()=>{ openSessionFromSearch(r.sessionId, r.message && r.message.content); };
    list.appendChild(el);
  });
  panel.style.display = 'block';
}

function closeSearchResults(){ document.getElementById('search-results').style.display='none'; }

function openSessionFromSearch(sessionId, snippet){
  let conv = appState.conversations.find(c=>c.id===sessionId);
  if(!conv){ // create a thin conversation placeholder and load history from backend
    conv = { id: sessionId, title: 'Imported', provider: 'huggingface', model: '', messages: [], createdAt: Date.now() };
    appState.conversations.push(conv);
    // attempt to fetch full history
    fetch(`/history?sessionId=${encodeURIComponent(sessionId)}`, { method: 'GET', headers: getAuthHeaders() }).then(r=>r.json().then(data=>{
      if(data && data.messages) conv.messages = data.messages; saveState(); render();
    }).catch(()=>{})).catch(()=>{});
  }
  appState.activeConversationId = sessionId; saveState(); render(); closeSearchResults();
  if(snippet){ setTimeout(()=>{ alert('Snippet:\n'+String(snippet).slice(0,800)); }, 80); }
}

// Accessibility: keyboard handlers
document.addEventListener('keydown', (e)=>{
  // Close menus on Escape
  if(e.key === 'Escape'){
    const m = document.getElementById('export-menu'); if(m) { m.style.display='none'; }
    const panel = document.getElementById('search-results'); if(panel) panel.style.display='none';
    const exportBtn = document.getElementById('export-btn'); if(exportBtn) exportBtn.setAttribute('aria-expanded','false');
  }
});

// Allow Enter in search input to trigger search
const searchInputEl = document.getElementById('search-input');
if(searchInputEl){ searchInputEl.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); performSearch(); } }); }
</script>

<!-- Auth token modal -->
<div id="auth-modal" role="dialog" aria-modal="true" aria-hidden="true" style="display:none;position:fixed;inset:0;background:rgba(2,6,10,0.6);align-items:center;justify-content:center;z-index:60;">
  <div style="background:var(--panel);border:1px solid var(--border);padding:18px;border-radius:12px;width:420px;max-width:92%;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
      <strong>Set Auth Token</strong>
      <button class="btn-ghost" onclick="closeAuthModal()">Close</button>
    </div>
    <p style="color:var(--muted);font-size:.95rem;margin-bottom:8px">Paste a JWT Bearer token to use for protected API endpoints.</p>
    <textarea id="auth-token-input" rows="3" style="width:100%;background:var(--panel-2);border:1px solid var(--border);padding:10px;border-radius:8px;color:var(--text);"></textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;">
      <button class="btn-ghost" onclick="clearAuthToken()">Clear</button>
      <button class="btn-ghost" onclick="saveAuthToken()">Save</button>
    </div>
  </div>
</div>

<script>
  function openAuthModal(){
    const modal = document.getElementById('auth-modal');
    const input = document.getElementById('auth-token-input');
    if(!modal || !input) return;
    input.value = localStorage.getItem('auth_token') || '';
    modal.style.display = 'flex'; modal.setAttribute('aria-hidden','false'); input.focus();
  }
  function closeAuthModal(){ const modal=document.getElementById('auth-modal'); if(modal){ modal.style.display='none'; modal.setAttribute('aria-hidden','true'); } }
  function saveAuthToken(){ const v=document.getElementById('auth-token-input').value.trim(); if(v) localStorage.setItem('auth_token', v); else localStorage.removeItem('auth_token'); closeAuthModal(); renderAuthStatus(); }
  function clearAuthToken(){ localStorage.removeItem('auth_token'); document.getElementById('auth-token-input').value=''; renderAuthStatus(); }
  function renderAuthStatus(){ const btn = document.getElementById('auth-btn'); const token = localStorage.getItem('auth_token'); if(btn){ btn.textContent = token ? 'Auth ●' : 'Auth'; btn.title = token ? 'Auth token set' : 'No auth token'; } }
  document.addEventListener('DOMContentLoaded', renderAuthStatus);
  // Also call immediately in case script loaded after DOMContent
  renderAuthStatus();
</script>
<script>
  function openAnalytics(){
    window.open('/analytics.html','_blank');
  }
</script>
