<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unified AI Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{
  --bg:#0a0e14;
  --bg-2:#0d121a;
  --panel:#121a24;
  --panel-2:#0f1722;
  --panel-3:#0b1119;
  --border:#1c2736;
  --text:#eaf0f6;
  --muted:#94a3b8;
  --accent:#f472b6;
  --accent-2:#38bdf8;
  --shadow:0 22px 60px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:"Manrope",system-ui,sans-serif;
  color:var(--text);
  background:
    radial-gradient(720px 420px at 10% -10%, #1d2840 0%, transparent 60%),
    radial-gradient(980px 520px at 95% 0%, #2b1b36 0%, transparent 55%),
    linear-gradient(180deg, var(--bg), var(--bg-2));
  height:100vh;
  display:flex;
  overflow:hidden;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:radial-gradient(#ffffff10 1px, transparent 1px);
  background-size:26px 26px;
  opacity:.14;
  pointer-events:none;
}
*{scrollbar-width:none;}
*::-webkit-scrollbar{width:0;height:0;}

aside{
  width:300px;
  background:linear-gradient(180deg, #0f151f, #0b1017);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:18px 14px;
  gap:14px;
  transition:width .2s ease;
}
.sidebar-collapsed aside{width:76px;}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:700;
  letter-spacing:.3px;
}
.brand-badge{
  width:14px;height:14px;border-radius:5px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 0 16px rgba(34,211,238,.45);
}
.brand-text{font-size:1rem;}
.sidebar-collapsed .brand-text{display:none;}
.btn-new{
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--text);
  padding:10px 12px;
  border-radius:12px;
  cursor:pointer;
  font-weight:600;
  transition:transform .15s ease, background .2s ease;
}
.btn-new:hover{background:#17212f;transform:translateY(-1px);}
.sidebar-collapsed .btn-new{font-size:0; padding:10px; width:44px; align-self:center;}
.sidebar-collapsed .btn-new::before{content:"+";font-size:1rem;}
.history-title{
  color:var(--muted);
  font-size:.8rem;
  letter-spacing:.6px;
  text-transform:uppercase;
}
.sidebar-collapsed .history-title{display:none;}
.history-list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;}
.history-item{
  padding:10px 12px;
  border-radius:10px;
  color:var(--muted);
  cursor:pointer;
  border:1px solid transparent;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.history-title-text{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.history-actions{display:flex;gap:6px;opacity:0;transition:opacity .15s ease;}
.history-item:hover .history-actions{opacity:1;}
.history-btn{
  background:#141b26;border:1px solid var(--border);color:var(--muted);
  width:24px;height:24px;border-radius:6px;font-size:.7rem;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
}
.history-btn:hover{color:var(--text);border-color:#2a3b52;}
.history-input{
  flex:1;
  background:#0f151e;
  border:1px solid #2a3b52;
  color:var(--text);
  padding:6px 8px;
  border-radius:8px;
  font-size:.85rem;
}
.history-item:hover{background:#151e2a;border-color:#243246;color:var(--text);}
.history-item.active{background:#182231;border-color:#2a3b52;color:var(--text);}
.sidebar-collapsed .history-item{font-size:0;padding:10px;width:44px;align-self:center;}
.sidebar-collapsed .history-item::before{content:"•";font-size:1rem;}
.sidebar-collapsed .history-actions{display:none;}
.sidebar-footer{
  border-top:1px solid var(--border);
  padding-top:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:var(--muted);
  font-size:.85rem;
}
.sidebar-collapsed .sidebar-footer span{display:none;}
.profile-pic{
  width:32px;height:32px;border-radius:10px;
  background:linear-gradient(135deg,#2f3b52,#1d2736);
}

main{
  flex:1;
  display:flex;
  flex-direction:column;
  position:relative;
}
.topbar{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  border-bottom:1px solid var(--border);
  background:rgba(12,17,24,.7);
  backdrop-filter:blur(10px);
}
.left-controls{display:flex;align-items:center;gap:10px;}
.btn-collapse{
  width:38px;height:38px;border-radius:10px;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--muted);
  cursor:pointer;
}
.btn-collapse:hover{color:var(--text);border-color:#2a3b52;}
.selectors{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
select{
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--text);
  padding:8px 12px;
  border-radius:10px;
  font-size:.85rem;
  outline:none;
  cursor:pointer;
}
.toggles{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:.85rem;}
.toggle{
  display:flex;align-items:center;gap:8px;
  background:var(--panel);
  border:1px solid var(--border);
  padding:6px 10px;border-radius:999px;
}
.toggle input{accent-color:var(--accent);}
.btn-ghost{
  background:transparent;border:1px solid var(--border);color:var(--muted);
  padding:8px 12px;border-radius:10px;cursor:pointer;
}
.btn-ghost:hover{color:var(--text);border-color:#2a3b52;}

#chat-container{
  flex:1;
  overflow:auto;
  padding:26px 9%;
  display:flex;
  flex-direction:column;
  gap:16px;
}
.empty{
  margin:auto;
  text-align:center;
  color:var(--muted);
  max-width:520px;
  line-height:1.6;
}
.message{
  max-width:920px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px 18px;
  box-shadow:var(--shadow);
}
.message.user{
  align-self:flex-end;
  background:linear-gradient(135deg,#1c2432,#131b28);
  border-color:#2a3a50;
}
.message.ai{align-self:flex-start;background:var(--panel-2);}
.message-header{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;
}
.model-tag{
  font-size:.72rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;
}
.msg-actions{display:flex;gap:8px;}
.msg-action{
  background:#141b26;
  border:1px solid var(--border);
  color:var(--muted);
  padding:4px 8px;border-radius:8px;font-size:.72rem;cursor:pointer;
}
.msg-action:hover{color:var(--text);border-color:#2a3b52;}
.msg-footer{
  margin-top:10px;
  display:flex;
  justify-content:flex-end;
}
.voice-btn{
  background:#141b26;border:1px solid var(--border);color:var(--muted);
  width:30px;height:30px;border-radius:10px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:.9rem;
}
.voice-btn:hover{color:var(--text);border-color:#2a3b52;}
.voice-select{
  background:#141b26;border:1px solid var(--border);color:var(--muted);
  padding:4px 6px;border-radius:8px;font-size:.7rem;cursor:pointer;
}

.message-content{color:var(--text);font-size:1rem;line-height:1.7;}
.message-content p{margin:0 0 12px 0;}
.message-content h1,.message-content h2,.message-content h3{margin:16px 0 10px;line-height:1.2;}
.message-content ul,.message-content ol{margin:0 0 12px 20px;}
.message-content code{
  background:#0f141c;border:1px solid #202a3a;
  padding:2px 6px;border-radius:6px;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:.95em;
}
.message-content pre{
  position:relative;
  background:#0f141c;
  border:1px solid #202a3a;
  padding:14px 16px;border-radius:12px;overflow:auto;
}
.message-content pre code{
  display:block;background:transparent;padding:0;white-space:pre;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
}
.code-copy{
  position:absolute;top:10px;right:10px;
  background:#1b2636;border:1px solid #2a3b52;color:#e8eef6;
  border-radius:8px;padding:4px 8px;font-size:.75rem;cursor:pointer;
}
.code-copy:hover{background:#223149;}

.input-wrap{
  padding:16px 9% 26px;
  background:linear-gradient(180deg, transparent, rgba(10,14,20,.92) 30%);
}
.input-box{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:10px 14px;
  display:flex;
  align-items:stretch;
  gap:12px;
  box-shadow:var(--shadow);
  min-height:56px;
}
textarea{
  flex:1;
  background:transparent;border:none;color:var(--text);
  resize:none;font-family:inherit;font-size:1rem;outline:none;max-height:220px;
  padding:10px 0;
  line-height:1.5;
}
.btn-send{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#0a0d11;border:none;width:38px;height:38px;border-radius:10px;
  cursor:pointer;font-weight:700;
  align-self:center;
}
.btn-send:disabled{opacity:.6;cursor:not-allowed;}
.typing-indicator{color:var(--muted);font-size:.85rem;}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.55);
  display:none;align-items:center;justify-content:center;
  z-index:50;
}
.modal{
  width:min(420px, 90vw);
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
  box-shadow:var(--shadow);
}
.modal h3{margin:0 0 8px 0;font-size:1.1rem;}
.modal p{margin:0 0 16px 0;color:var(--muted);}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;}
.btn-secondary{
  background:transparent;border:1px solid var(--border);color:var(--muted);
  padding:8px 12px;border-radius:10px;cursor:pointer;
}
.btn-secondary:hover{color:var(--text);border-color:#2a3b52;}
.btn-danger{
  background:linear-gradient(135deg,#f87171,#fb7185);
  color:#0b0e12;border:none;padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:700;
}

@media (max-width: 980px){
  aside{display:none;}
  #chat-container{padding:22px 6%;}
  .input-wrap{padding:14px 6% 20px;}
}
</style>
</head>
<body>

<aside>
  <div class="brand">
    <span class="brand-badge"></span>
    <span class="brand-text">Unified AI</span>
  </div>
  <button class="btn-new" onclick="newChat()">New Chat</button>
  <div class="history-title">History</div>
  <div class="history-list chat-list"></div>
  <div class="sidebar-footer">
    <span>Workspace</span>
    <div class="profile-pic"></div>
  </div>
</aside>

<main>
  <div class="topbar">
    <div class="left-controls">
      <button class="btn-collapse" id="collapse-btn">☰</button>
      <div class="selectors">
        <select id="provider-select">
          <option value="gpt">ChatGPT</option>
          <option value="claude">Claude</option>
          <option value="gemini">Gemini</option>
          <option value="huggingface" selected>Hugging Face</option>
        </select>
        <select id="model-select"></select>
      </div>
    </div>
    <div class="toggles">
      <button class="btn-ghost" onclick="clearChat()">Clear</button>
      <label class="toggle">Stream <input id="stream-toggle" type="checkbox" checked></label>
    </div>
  </div>

  <div id="chat-container" class="chat-messages"></div>

  <div class="input-wrap">
    <div class="input-box">
      <span class="typing-indicator" id="typing-indicator" style="display:none;">AI typing…</span>
      <textarea id="user-input" placeholder="Ask anything..." rows="1"></textarea>
      <button id="send-btn" class="btn-send" onclick="sendMessage()">↑</button>
    </div>
  </div>
</main>

<div class="modal-backdrop" id="confirm-modal">
  <div class="modal">
    <h3 id="confirm-title">Delete chat?</h3>
    <p id="confirm-message">This will remove the conversation and its messages.</p>
    <div class="modal-actions">
      <button class="btn-secondary" id="confirm-cancel">Cancel</button>
      <button class="btn-danger" id="confirm-ok">Delete</button>
    </div>
  </div>
</div>

<script>
const API_BASE = "http://localhost:3001";
const models = {
  gpt: ['GPT-4o','GPT-4 Turbo','GPT-3.5'],
  claude: ['Claude 3.5 Sonnet','Claude 3 Opus','Claude 3 Haiku'],
  gemini: ['Gemini 1.5 Pro','Gemini 1.5 Flash'],
  huggingface: ['meta-llama/Llama-3.1-8B-Instruct']
};

let appState = { conversations:[], activeConversationId:null };
let uiState = { sidebarCollapsed:false, streamEnabled:true };
let confirmResolve = null;

function saveUi(){ localStorage.setItem("ui_state", JSON.stringify(uiState)); }
function loadUi(){
  const saved = localStorage.getItem("ui_state");
  if(saved) uiState = { ...uiState, ...JSON.parse(saved) };
}

async function apiGet(path){
  const res = await fetch(`${API_BASE}${path}`);
  return res.json();
}
async function apiPost(path, payload){
  const res = await fetch(`${API_BASE}${path}`, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(payload || {})
  });
  return res.json();
}

function createMessage(role, content, provider=null, model=null){ return { role, content, provider, model, timestamp:Date.now() }; }

async function loadConversations(){
  const data = await apiGet("/conversations");
  appState.conversations = data.conversations || [];
  if (!appState.activeConversationId && appState.conversations.length) {
    appState.activeConversationId = appState.conversations[0].id;
    await loadConversation(appState.activeConversationId);
  }
}

async function loadConversation(id){
  const data = await apiGet(`/conversations/${id}`);
  const conv = appState.conversations.find(c => c.id === id);
  if (conv) {
    conv.messages = data.messages || [];
  }
  appState.activeConversationId = id;
  render();
}

function renderConversationList(){
  const list = document.querySelector(".chat-list");
  list.innerHTML = "";
  appState.conversations.forEach(conv=>{
    const div=document.createElement("div");
    div.className="history-item"+(conv.id===appState.activeConversationId?" active":"");
    div.dataset.id = conv.id;
    const title = conv.title || "New Chat";
    div.innerHTML = `
      ${conv.isEditing
        ? `<input class="history-input" value="${title.replace(/"/g,'&quot;')}" />`
        : `<span class="history-title-text">${title}</span>`}
      <span class="history-actions">
        <button class="history-btn" data-action="rename" title="Rename">✎</button>
        <button class="history-btn" data-action="delete" title="Delete">🗑</button>
      </span>
    `;
    div.title=conv.title || "New Chat";
    div.onclick=(e)=>{
      const btn = e.target.closest(".history-btn");
      if (btn) return;
      if (conv.isEditing) return;
      loadConversation(conv.id);
    };
    div.querySelector('[data-action="rename"]').onclick = (e) => {
      e.stopPropagation();
      conv.isEditing = true;
      renderConversationList();
      const row = document.querySelector(`.history-item[data-id="${conv.id}"]`);
      const input = row ? row.querySelector(".history-input") : null;
      if (input) {
        setTimeout(() => { input.focus(); input.select(); }, 0);
        input.onclick = (ev) => ev.stopPropagation();
        let saved = false;
        const save = () => {
          if (saved) return;
          saved = true;
          const next = input.value.trim() || "New Chat";
          conv.title = next;
          conv.isEditing = false;
          renderConversationList();
          apiPost(`/conversations/${conv.id}/rename`, { title: next }).catch(() => {});
        };
        const cancel = () => { conv.isEditing = false; renderConversationList(); };
        input.onkeydown = (ev) => {
          if (ev.key === "Enter") { ev.preventDefault(); ev.stopPropagation(); save(); }
          if (ev.key === "Escape") { ev.preventDefault(); ev.stopPropagation(); cancel(); }
        };
        input.onblur = () => { if (conv.isEditing) save(); };
      }
    };
    div.querySelector('[data-action="delete"]').onclick = async (e) => {
      e.stopPropagation();
      const ok = await showConfirm("Delete chat?", "This will remove the conversation and its messages.");
      if (!ok) return;
      const resp = await apiPost(`/conversations/${conv.id}/delete`, {});
      if (resp && resp.error) {
        showConfirm("Delete failed", resp.error, false);
        return;
      }
      appState.conversations = appState.conversations.filter(c => c.id !== conv.id);
      if (appState.activeConversationId === conv.id) {
        appState.activeConversationId = appState.conversations[0]?.id || null;
        if (appState.activeConversationId) {
          await loadConversation(appState.activeConversationId);
        }
      }
      renderConversationList();
      renderMessages();
    };
    list.appendChild(div);
  });
}

function renderMessages(){
  const chat=document.querySelector(".chat-messages");
  chat.innerHTML="";
  const conv=appState.conversations.find(c=>c.id===appState.activeConversationId);
  if(!conv){
    chat.innerHTML = `<div class="empty">Start a new chat to see conversation history here.</div>`;
    return;
  }
  (conv.messages || []).forEach(msg=>{
    const div=document.createElement("div");
    div.className="message "+(msg.role==="assistant"?"ai":"user");
    if (msg.role === "assistant") {
      div.innerHTML = `
        <div class="message-header">
          <span class="model-tag">${msg.model || ""}</span>
          <div class="msg-actions">
            <button class="msg-action" data-copy="true">Copy</button>
          </div>
        </div>
        <div class="message-content">${renderMarkdown(msg.content || "")}</div>
        <div class="msg-footer">
          <button class="voice-btn" data-speak="true" title="Read aloud">🔊</button>
          <button class="voice-btn" data-stop="true" title="Stop">⏹</button>
          <select class="voice-select" data-voice="true"></select>
        </div>
      `;
      div.querySelector('[data-copy="true"]').onclick = () => {
        navigator.clipboard.writeText(msg.content || "");
      };
      div.querySelector('[data-speak="true"]').onclick = () => {
        const select = div.querySelector('[data-voice="true"]');
        speakText(msg.content || "", select ? select.value : "");
      };
      div.querySelector('[data-stop="true"]').onclick = () => {
        stopSpeak();
      };
      const voiceSelect = div.querySelector('[data-voice="true"]');
      if (voiceSelect) {
        populateVoiceSelect(voiceSelect);
      }
      enhanceCodeBlocks(div);
    } else {
      div.textContent = msg.content || "";
    }
    chat.appendChild(div);
  });
  chat.scrollTop=chat.scrollHeight;
}

function render(){ renderConversationList(); renderMessages(); updateModels(); }

function updateModels(){
  const provider=document.getElementById('provider-select').value;
  const modelSelect=document.getElementById('model-select');
  modelSelect.innerHTML="";
  models[provider].forEach(m=>{
    const opt=document.createElement('option');
    opt.value=m; opt.textContent=m;
    modelSelect.appendChild(opt);
  });
}

async function sendMessage(){
  const input=document.getElementById('user-input');
  const text=input.value.trim();
  if(!text) return;
  input.value = "";
  const provider=document.getElementById('provider-select').value;
  const model=document.getElementById('model-select').value;

  const sendBtn = document.getElementById('send-btn');
  const typingEl = document.getElementById('typing-indicator');
  const setLoading = (loading) => {
    typingEl.style.display = loading ? 'inline-block' : 'none';
    sendBtn.disabled = loading;
    input.disabled = loading;
    sendBtn.style.opacity = loading ? '0.6' : '';
  };

  setLoading(true);
  let conv = null;
  try {
    conv=appState.conversations.find(c=>c.id===appState.activeConversationId);
    if(!conv){
      const created = await apiPost("/conversations", { title:"New Chat", provider, model });
      conv = { ...created, messages:[] };
      appState.conversations.unshift(conv);
      appState.activeConversationId = conv.id;
    } else {
      conv.provider = provider;
      conv.model = model;
    }

    const userMsg = createMessage("user", text, conv.provider, conv.model);
    conv.messages.push(userMsg);
    if (!conv.title || conv.title === "New Chat") {
      const title = text.slice(0,30);
      conv.title = title;
      await apiPost(`/conversations/${conv.id}/rename`, { title });
    }
    render();

    await apiPost(`/conversations/${conv.id}/messages`, {
      role: "user",
      content: text,
      provider: conv.provider,
      model: conv.model,
      timestamp: userMsg.timestamp,
      title: conv.title
    });

    const streamEnabled = document.getElementById("stream-toggle").checked;
    const payload = { conversationId: conv.id, text, provider: conv.provider, model: conv.model, stream: streamEnabled && conv.provider === "huggingface" };

    const response = await fetch(`${API_BASE}/sendmessage`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const contentType = response.headers.get("content-type") || "";
    if (contentType.includes("text/event-stream") && response.body) {
      const assistantMsg = createMessage("assistant", "", conv.provider, conv.model);
      conv.messages.push(assistantMsg);
      renderMessages();

      const reader = response.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";
      let done = false;
      while (!done) {
        const result = await reader.read();
        done = result.done;
        if (result.value) {
          buffer += decoder.decode(result.value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop() || "";
          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed.startsWith("data:")) continue;
            const data = trimmed.slice(5).trim();
            if (data === "[DONE]") { done = true; break; }
            try {
              const parsed = JSON.parse(data);
              if (parsed?.error) { assistantMsg.content += `\n\n**Error:** ${parsed.error}`; continue; }
              const delta = parsed?.choices?.[0]?.delta?.content || parsed?.choices?.[0]?.message?.content || "";
              if (delta) assistantMsg.content += delta;
            } catch (e) {}
          }
          renderMessages();
        }
      }
      await apiPost(`/conversations/${conv.id}/messages`, {
        role: "assistant",
        content: assistantMsg.content,
        provider: conv.provider,
        model: conv.model,
        timestamp: assistantMsg.timestamp
      });
      if (!conv.autoNamed && (conv.title === "New Chat" || !conv.title)) {
        const resp = await apiPost(`/conversations/${conv.id}/autoname`, {});
        if (resp && resp.title) {
          conv.title = resp.title;
          conv.autoNamed = true;
          renderConversationList();
        }
      }
    } else {
      const data = await response.json();
      if (data && data.message) {
        const respProvider = data.provider || conv.provider;
        const respModel = data.model || conv.model;
        const assistantMsg = createMessage("assistant", data.message, respProvider, respModel);
        conv.messages.push(assistantMsg);
        await apiPost(`/conversations/${conv.id}/messages`, {
          role: "assistant",
          content: data.message,
          provider: respProvider,
          model: respModel,
          timestamp: assistantMsg.timestamp
        });
        if (!conv.autoNamed && (conv.title === "New Chat" || !conv.title)) {
          const resp = await apiPost(`/conversations/${conv.id}/autoname`, {});
          if (resp && resp.title) {
            conv.title = resp.title;
            conv.autoNamed = true;
            renderConversationList();
          }
        }
      } else if (data && data.error) {
        conv.messages.push(createMessage("assistant", `AI error: ${data.error}`));
      } else {
        conv.messages.push(createMessage("assistant", "No response from backend."));
      }
    }
    render();
  } catch(err){
    console.error("Backend request failed:", err);
    if (!conv) {
      conv = { id: "local", title: "New Chat", provider, model, messages:[] };
      appState.conversations.unshift(conv);
      appState.activeConversationId = conv.id;
    }
    conv.messages.push(createMessage("assistant", `AI response failed: ${err.message || err}`));
    render();
  } finally {
    setLoading(false);
  }
}

function newChat(){ appState.activeConversationId=null; render(); }
async function clearChat(){
  const conv=appState.conversations.find(c=>c.id===appState.activeConversationId);
  if(!conv) return;
  conv.messages=[];
  await apiPost(`/conversations/${conv.id}/clear`, {});
  render();
}

function renderMarkdown(text){
  if (window.marked) return marked.parse(text || "", { breaks: true });
  return (text || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function enhanceCodeBlocks(container){
  container.querySelectorAll('pre code').forEach(code => {
    if (window.hljs) hljs.highlightElement(code);
  });
  container.querySelectorAll('pre').forEach(pre => {
    if (pre.dataset.enhanced) return;
    pre.dataset.enhanced = "1";
    const btn = document.createElement("button");
    btn.className = "code-copy";
    btn.textContent = "Copy";
    btn.onclick = async () => {
      const code = pre.querySelector("code");
      if (!code) return;
      await navigator.clipboard.writeText(code.innerText);
      btn.textContent = "Copied";
      setTimeout(() => btn.textContent = "Copy", 1200);
    };
    pre.appendChild(btn);
  });
}

let cachedVoices = [];
function refreshVoices(){
  if (!("speechSynthesis" in window)) return [];
  cachedVoices = window.speechSynthesis.getVoices() || [];
  return cachedVoices;
}
function populateVoiceSelect(select){
  if (!select) return;
  const voices = refreshVoices();
  select.innerHTML = "";
  if (!voices.length) {
    const opt = document.createElement("option");
    opt.value = "";
    opt.textContent = "Default voice";
    select.appendChild(opt);
    return;
  }
  voices.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v.name;
    opt.textContent = `${v.name} (${v.lang})`;
    select.appendChild(opt);
  });
}
window.speechSynthesis && (window.speechSynthesis.onvoiceschanged = () => {
  document.querySelectorAll('[data-voice="true"]').forEach(sel => populateVoiceSelect(sel));
});

function speakText(text, voiceName=""){
  if (!("speechSynthesis" in window)) {
    showConfirm("TTS not supported", "Your browser does not support speech synthesis.", false);
    return;
  }
  if (!text) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const voices = refreshVoices();
  if (voiceName) {
    const match = voices.find(v => v.name === voiceName);
    if (match) utter.voice = match;
  }
  utter.rate = 1;
  utter.pitch = 1;
  window.speechSynthesis.speak(utter);
}
function stopSpeak(){
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
}

function showConfirm(title, message, showCancel=true){
  const modal = document.getElementById("confirm-modal");
  document.getElementById("confirm-title").textContent = title || "Confirm";
  document.getElementById("confirm-message").textContent = message || "";
  const btnCancel = document.getElementById("confirm-cancel");
  btnCancel.style.display = showCancel ? "inline-block" : "none";
  modal.style.display = "flex";
  return new Promise(resolve => {
    confirmResolve = resolve;
  });
}
document.getElementById("confirm-cancel").onclick = () => {
  const modal = document.getElementById("confirm-modal");
  modal.style.display = "none";
  if (confirmResolve) confirmResolve(false);
  confirmResolve = null;
};
document.getElementById("confirm-ok").onclick = () => {
  const modal = document.getElementById("confirm-modal");
  modal.style.display = "none";
  if (confirmResolve) confirmResolve(true);
  confirmResolve = null;
};
document.getElementById("confirm-modal").onclick = (e) => {
  if (e.target.id === "confirm-modal") {
    const modal = document.getElementById("confirm-modal");
    modal.style.display = "none";
    if (confirmResolve) confirmResolve(false);
    confirmResolve = null;
  }
};

loadConversations().then(render);

});
