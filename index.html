<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Unified Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{
  --bg-1:#0b0f14;
  --bg-2:#0f1720;
  --panel:#141b25;
  --panel-2:#10161f;
  --panel-3:#0c121a;
  --border:#1e2a3a;
  --text:#e8eef6;
  --muted:#9aa8ba;
  --accent:#14b8a6;
  --accent-2:#f59e0b;
  --danger:#f87171;
  --shadow:0 20px 60px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:"Space Grotesk",system-ui,sans-serif;
  color:var(--text);
  background:
    radial-gradient(1200px 600px at 10% -10%, #113249 0%, transparent 55%),
    radial-gradient(900px 500px at 90% 0%, #1b2b3d 0%, transparent 55%),
    linear-gradient(180deg, var(--bg-1), var(--bg-2));
  height:100vh;
  display:flex;
  overflow:hidden;
}
/* Hide scrollbars but keep scroll */
*{
  scrollbar-width:none;
}
*::-webkit-scrollbar{
  width:0;
  height:0;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background-image:radial-gradient(#ffffff10 1px, transparent 1px);
  background-size:24px 24px;
  opacity:.15;
  pointer-events:none;
}

aside{
  width:280px;
  background:linear-gradient(180deg, #0c121a, #0b1017);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:20px 16px;
  gap:16px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:700;
  letter-spacing:.2px;
  font-size:1.1rem;
}
.brand-dot{
  width:12px;height:12px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 0 18px rgba(20,184,166,.6);
}
.btn-new{
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--text);
  padding:10px 12px;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
  transition:transform .15s ease, background .2s ease;
}
.btn-new:hover{background:#172231;transform:translateY(-1px);}
.history-list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;}
.history-item{
  padding:10px 12px;
  border-radius:10px;
  color:var(--muted);
  cursor:pointer;
  background:transparent;
  border:1px solid transparent;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.history-item:hover{background:#121a26;border-color:#1f2b3c;color:var(--text);}
.history-item.active{background:#152131;border-color:#243347;color:var(--text);}
.sidebar-footer{
  border-top:1px solid var(--border);
  padding-top:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:var(--muted);
  font-size:.85rem;
}
.profile-pic{
  width:32px;height:32px;border-radius:10px;
  background:linear-gradient(135deg,#2f3b52,#1d2736);
}

main{
  flex:1;
  display:flex;
  flex-direction:column;
  position:relative;
}
.topbar{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  border-bottom:1px solid var(--border);
  background:rgba(12,18,26,.6);
  backdrop-filter:blur(8px);
}
.selectors{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
select{
  background:var(--panel);
  border:1px solid var(--border);
  color:var(--text);
  padding:8px 12px;
  border-radius:10px;
  font-size:.85rem;
  outline:none;
  cursor:pointer;
}
.toggles{display:flex;gap:16px;align-items:center;color:var(--muted);font-size:.85rem;}
.toggle{
  display:flex;align-items:center;gap:8px;
  background:var(--panel);
  border:1px solid var(--border);
  padding:6px 10px;border-radius:999px;
}
.toggle input{accent-color:var(--accent);}
.btn-ghost{
  background:transparent;border:1px solid var(--border);color:var(--muted);
  padding:8px 12px;border-radius:10px;cursor:pointer;
}
.btn-ghost:hover{color:var(--text);border-color:#2a3b52;}

#chat-container{
  flex:1;
  overflow:auto;
  padding:28px 10%;
  display:flex;
  flex-direction:column;
  gap:18px;
}
.message{
  max-width:900px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px 18px;
  box-shadow:var(--shadow);
}
.message.user{
  align-self:flex-end;
  background:linear-gradient(135deg,#1a2736,#121b27);
  border-color:#2a3b52;
}
.message.ai{align-self:flex-start;background:var(--panel-2);}
.message-header{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;
}
.model-tag{
  font-size:.72rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;
}
.msg-actions{display:flex;gap:8px;}
.msg-action{
  background:var(--panel-3);
  border:1px solid var(--border);
  color:var(--muted);
  padding:4px 8px;border-radius:8px;font-size:.72rem;cursor:pointer;
}
.msg-action:hover{color:var(--text);border-color:#2a3b52;}

.message-content{color:var(--text);font-size:1rem;line-height:1.7;}
.message-content p{margin:0 0 12px 0;}
.message-content h1,.message-content h2,.message-content h3{margin:16px 0 10px;line-height:1.2;}
.message-content ul,.message-content ol{margin:0 0 12px 20px;}
.message-content code{
  background:#0f141c;border:1px solid #202a3a;
  padding:2px 6px;border-radius:6px;
  font-family:"JetBrains Mono",ui-monospace,monospace;
  font-size:.95em;
}
.message-content pre{
  position:relative;
  background:#0f141c;
  border:1px solid #202a3a;
  padding:14px 16px;border-radius:12px;overflow:auto;
}
.message-content pre code{
  display:block;background:transparent;padding:0;white-space:pre;
  font-family:"JetBrains Mono",ui-monospace,monospace;
}
.code-copy{
  position:absolute;top:10px;right:10px;
  background:#1b2636;border:1px solid #2a3b52;color:#e8eef6;
  border-radius:8px;padding:4px 8px;font-size:.75rem;cursor:pointer;
}
.code-copy:hover{background:#223149;}

.input-wrap{
  padding:18px 10% 28px;
  background:linear-gradient(180deg, transparent, rgba(11,15,20,.9) 30%);
}
.input-box{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px 14px;
  display:flex;
  align-items:flex-end;
  gap:12px;
  box-shadow:var(--shadow);
}
textarea{
  flex:1;
  background:transparent;border:none;color:var(--text);
  resize:none;font-family:inherit;font-size:1rem;outline:none;max-height:220px;
}
.btn-send{
  background:linear-gradient(135deg,var(--accent),#0ea5a5);
  color:#041016;border:none;width:38px;height:38px;border-radius:10px;
  cursor:pointer;font-weight:700;
}
.btn-send:disabled{opacity:.6;cursor:not-allowed;}
.typing-indicator{color:var(--muted);font-size:.85rem;}

@media (max-width: 980px){
  aside{display:none;}
  #chat-container{padding:24px 6%;}
  .input-wrap{padding:16px 6% 22px;}
}
</style>
</head>
<body>

<aside>
  <div class="brand"><span class="brand-dot"></span>Unified AI</div>
  <button class="btn-new" onclick="newChat()">+ New Chat</button>
  <div class="history-list chat-list"></div>
  <div class="sidebar-footer">
    <span>Workspace</span>
    <div class="profile-pic"></div>
  </div>
</aside>

<main>
  <div class="topbar">
    <div class="selectors">
      <select id="provider-select">
        <option value="gpt">ChatGPT</option>
        <option value="claude">Claude</option>
        <option value="gemini">Gemini</option>
        <option value="huggingface" selected>Hugging Face</option>
      </select>
      <select id="model-select"></select>
    </div>
    <div class="toggles">
      <button class="btn-ghost" onclick="clearChat()">Clear</button>
      <label class="toggle">Memory <input type="checkbox" checked></label>
      <label class="toggle">Stream <input id="stream-toggle" type="checkbox" checked></label>
    </div>
  </div>

  <div id="chat-container" class="chat-messages"></div>

  <div class="input-wrap">
    <div class="input-box">
      <span class="typing-indicator" id="typing-indicator" style="display:none;">AI typing…</span>
      <textarea id="user-input" placeholder="Ask anything..." rows="1"></textarea>
      <button id="send-btn" class="btn-send" onclick="sendMessage()">↑</button>
    </div>
  </div>
</main>

<script>
const models = {
  gpt: ['GPT-4o','GPT-4 Turbo','GPT-3.5'],
  claude: ['Claude 3.5 Sonnet','Claude 3 Opus','Claude 3 Haiku'],
  gemini: ['Gemini 1.5 Pro','Gemini 1.5 Flash'],
  huggingface: ['meta-llama/Llama-3.1-8B-Instruct']
};

let appState = { conversations:[], activeConversationId:null };

function saveState(){ localStorage.setItem("ai_workspace_state", JSON.stringify(appState)); }
function loadState(){ const saved = localStorage.getItem("ai_workspace_state"); if(saved) appState = JSON.parse(saved); }

function createConversation(provider, model){ return { id:crypto.randomUUID(), title:"New Chat", provider, model, messages:[], createdAt:Date.now() }; }
function createMessage(role, content, provider=null, model=null){ return { role, content, provider, model, timestamp:Date.now() }; }

function renderConversationList(){
  const list = document.querySelector(".chat-list");
  list.innerHTML = "";
  appState.conversations.forEach(conv=>{
    const div=document.createElement("div");
    div.className="history-item"+(conv.id===appState.activeConversationId?" active":"");
    div.textContent=conv.title;
    div.onclick=()=>{ appState.activeConversationId=conv.id; saveState(); render(); };
    list.appendChild(div);
  });
}

function renderMessages(){
  const chat=document.querySelector(".chat-messages");
  chat.innerHTML="";
  const conv=appState.conversations.find(c=>c.id===appState.activeConversationId);
  if(!conv) return;
  conv.messages.forEach(msg=>{
    const div=document.createElement("div");
    div.className="message "+(msg.role==="assistant"?"ai":"user");
    if (msg.role === "assistant") {
      div.innerHTML = `
        <div class="message-header">
          <span class="model-tag">${msg.model || ""}</span>
          <div class="msg-actions">
            <button class="msg-action" data-copy="true">Copy</button>
          </div>
        </div>
        <div class="message-content">${renderMarkdown(msg.content || "")}</div>
      `;
      div.querySelector('[data-copy="true"]').onclick = () => {
        navigator.clipboard.writeText(msg.content || "");
      };
      enhanceCodeBlocks(div);
    } else {
      div.textContent = msg.content || "";
    }
    chat.appendChild(div);
  });
  chat.scrollTop=chat.scrollHeight;
}

function render(){ renderConversationList(); renderMessages(); updateModels(); }

function updateModels(){
  const provider=document.getElementById('provider-select').value;
  const modelSelect=document.getElementById('model-select');
  modelSelect.innerHTML="";
  models[provider].forEach(m=>{
    const opt=document.createElement('option');
    opt.value=m; opt.textContent=m;
    modelSelect.appendChild(opt);
  });
}

async function sendMessage(){
  const input=document.getElementById('user-input');
  const text=input.value.trim();
  if(!text) return;
  const provider=document.getElementById('provider-select').value;
  const model=document.getElementById('model-select').value;
  let conv=appState.conversations.find(c=>c.id===appState.activeConversationId);
  if(!conv){
    conv=createConversation(provider,model);
    appState.conversations.push(conv);
    appState.activeConversationId=conv.id;
  } else {
    conv.provider = provider;
    conv.model = model;
  }

  conv.messages.push(createMessage("user", text, conv.provider, conv.model));
  conv.title=text.slice(0,30);
  render();
  saveState();
  input.value="";

  const sendBtn = document.getElementById('send-btn');
  const typingEl = document.getElementById('typing-indicator');
  const setLoading = (loading) => {
    typingEl.style.display = loading ? 'inline-block' : 'none';
    sendBtn.disabled = loading;
    input.disabled = loading;
    sendBtn.style.opacity = loading ? '0.6' : '';
  };

  setLoading(true);
  try {
    const streamEnabled = document.getElementById("stream-toggle").checked;
    const payload = { conversationId: conv.id, text, provider: conv.provider, model: conv.model, stream: streamEnabled && conv.provider === "huggingface" };

    const response = await fetch("http://localhost:3001/sendmessage", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const contentType = response.headers.get("content-type") || "";
    if (contentType.includes("text/event-stream") && response.body) {
      const assistantMsg = createMessage("assistant", "", conv.provider, conv.model);
      conv.messages.push(assistantMsg);
      renderMessages();

      const reader = response.body.getReader();
      const decoder = new TextDecoder("utf-8");
      let buffer = "";
      let done = false;
      while (!done) {
        const result = await reader.read();
        done = result.done;
        if (result.value) {
          buffer += decoder.decode(result.value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop() || "";
          for (const line of lines) {
            const trimmed = line.trim();
            if (!trimmed.startsWith("data:")) continue;
            const data = trimmed.slice(5).trim();
            if (data === "[DONE]") { done = true; break; }
            try {
              const parsed = JSON.parse(data);
              if (parsed?.error) { assistantMsg.content += `\n\n**Error:** ${parsed.error}`; continue; }
              const delta = parsed?.choices?.[0]?.delta?.content || parsed?.choices?.[0]?.message?.content || "";
              if (delta) assistantMsg.content += delta;
            } catch (e) {}
          }
          renderMessages();
        }
      }
    } else {
      const data = await response.json();
      if (data && data.message) {
        const respProvider = data.provider || conv.provider;
        const respModel = data.model || conv.model;
        conv.messages.push(createMessage("assistant", data.message, respProvider, respModel));
      } else if (data && data.error) {
        conv.messages.push(createMessage("assistant", `AI error: ${data.error}`));
      } else {
        conv.messages.push(createMessage("assistant", "No response from backend."));
      }
    }

    render();
    saveState();
  } catch(err){
    console.error("Backend request failed:", err);
    conv.messages.push(createMessage("assistant", `AI response failed: ${err.message || err}`));
    render();
    saveState();
  } finally {
    setLoading(false);
  }
}

function newChat(){ appState.activeConversationId=null; render(); }
function clearChat(){
  const conv=appState.conversations.find(c=>c.id===appState.activeConversationId);
  if(!conv) return;
  conv.messages=[];
  saveState();
  render();
}

function renderMarkdown(text){
  if (window.marked) {
    return marked.parse(text || "", { breaks: true });
  }
  return (text || "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function enhanceCodeBlocks(container){
  container.querySelectorAll('pre code').forEach(code => {
    if (window.hljs) hljs.highlightElement(code);
  });
  container.querySelectorAll('pre').forEach(pre => {
    if (pre.dataset.enhanced) return;
    pre.dataset.enhanced = "1";
    const btn = document.createElement("button");
    btn.className = "code-copy";
    btn.textContent = "Copy";
    btn.onclick = async () => {
      const code = pre.querySelector("code");
      if (!code) return;
      await navigator.clipboard.writeText(code.innerText);
      btn.textContent = "Copied";
      setTimeout(() => btn.textContent = "Copy", 1200);
    };
    pre.appendChild(btn);
  });
}

loadState();
render();

document.querySelector('#user-input').addEventListener('keypress', function(e){
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});
</script>

</body>
</html>
